name: CI

on:
  push:
    branches:
      - master
      - dev
    paths-ignore:
      - '**/*.txt'
      - '.editorconfig'
      - '.gitignore'
      - '.idea/**'
  pull_request:
    branches:
      - master
      - dev
    paths-ignore:
      - '**/*.txt'
      - '.editorconfig'
      - '.gitignore'
      - '.idea/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' || 
      (
        !startsWith(github.event.head_commit.message, '[skip ci]') && 
        (
          github.ref == 'refs/heads/master' ||
          github.ref == 'refs/heads/dev' ||
          github.event_name == 'pull_request'
        )
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android

      - name: Install Android NDK
        run: |
          NDK_VERSION=$(sed -n 's/^ndk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          MIN_SDK=$(sed -n 's/^minSdk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          NDK_BIN="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$NDK_BIN/aarch64-linux-android$MIN_SDK-clang"
          test -x "$NDK_BIN/llvm-strip"

      - name: Prepare PRoot cache key
        id: proot_cache_inputs
        run: |
          echo "commit=$(git -C third_party/proot-static rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "ndk=$(sed -n 's/^ndk = \"\(.*\)\"/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"
          echo "min_sdk=$(sed -n 's/^minSdk = \"\(.*\)\"/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"

      - name: Cache PRoot build
        uses: actions/cache@v6
        with:
          path: target/proot-static
          key: proot-${{ runner.os }}-${{ runner.arch }}-${{ steps.proot_cache_inputs.outputs.commit }}-${{ steps.proot_cache_inputs.outputs.ndk }}-${{ steps.proot_cache_inputs.outputs.min_sdk }}-${{ hashFiles('patches/proot/android-ptrace-events.patch', 'third_party/proot-static/tools/build-static-aarch64.sh') }}
          restore-keys: |
            proot-${{ runner.os }}-${{ runner.arch }}-

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: . -> target

      - name: Cache Gradle build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/configuration-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-multilib

      - name: Validate i18n catalogs
        run: |
          cargo test -p xtask i18n_check
          ./x i18n-check

      - name: Build native library
        run: |
          cargo xtask configure
          cargo xtask build --native-only

      - name: Decode keystore
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/wekit-keystore.jks

      - name: Build Release (Signed)
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEKIT_KEYSTORE_FILE: ${{ runner.temp }}/wekit-keystore.jks
          WEKIT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          WEKIT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          WEKIT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --warning-mode all --stacktrace

      - name: Build Release (Unsigned)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew assembleRelease --warning-mode all --stacktrace

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p dist/apk

          expected_abis=arm64-v8a
          for flavor in standard legacy; do
            apk="app/build/outputs/apk/$flavor/release/app-$flavor-release.apk"
            test -f "$apk"

            actual_abis=$(unzip -Z1 "$apk" 'lib/*/*.so' | cut -d/ -f2 | sort -u)
            if [ "$actual_abis" != "$expected_abis" ]; then
              echo "::error file=$apk::Expected arm64-v8a-only APK, got: $actual_abis"
              exit 1
            fi

            cp -v "$apk" dist/apk/
          done

          echo "Collected APKs:"
          ls -1 dist/apk

      - name: Collect mappings
        run: |
          # One mapping.txt per flavor; rename per flavor to avoid collisions.
          mkdir -p dist/mapping
          for m in app/build/outputs/mapping/*/mapping.txt; do
            flavorDir=$(basename "$(dirname "$m")")   # e.g. standardRelease
            cp -v "$m" "dist/mapping/mapping-${flavorDir}.txt"
          done
          ls -1 dist/mapping || echo "(no mappings — unsigned PR build without minify?)"

      - name: Upload Release APKs
        uses: actions/upload-artifact@v7
        with:
          name: wekit-apk
          path: dist/apk/*.apk

      - name: Upload Release Obfuscation Mapping
        uses: actions/upload-artifact@v7
        with:
          name: wekit-mapping
          path: dist/mapping/*.txt
